[project]
name = "rag-langchain-higress-es"
version = "0.1.0"
description = "RAG Application with LangChain, Higress, and Elasticsearch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.0.0",
    "fastapi>=0.109.0",
    "langchain>=0.1.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-elasticsearch>=0.2.0",
    "langchain-text-splitters>=0.0.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.27.0",
    "volcengine>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
